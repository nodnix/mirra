name: Feature request / 功能建议
description: Suggest an improvement / 提议改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你想做什么 / What do you want to do
      description: 描述你的使用场景。
      placeholder: 例如：我想同时连接两台 iPhone……
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望效果（可选）/ Suggested behavior (optional)
    validations:
      required: false
