name: Feature request / 功能建议
description: Suggest an improvement / 提议改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: What do you want to do / 你想做什么
      description: Describe what you are trying to do. / 描述你的使用场景。
      placeholder: "Example: I want to connect two iPhones at once… / 例如：我想同时连接两台 iPhone……"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior (optional) / 期望效果（可选）
    validations:
      required: false
